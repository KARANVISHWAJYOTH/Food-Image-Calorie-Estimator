# Paths are relative to the ml/ directory.
dataset:
  food101_dir: data/food101
  nutrition5k_raw_dir: data/nutrition5k_raw
  nutrition5k_clean_csv: data/nutrition5k_clean.csv
  combined_labels_csv: data/combined_labels.csv

image_size: 224
batch_size: 32

model:
  backbone: resnet50
  num_classes: 101

training:
  learning_rate: 0.001
  lambda_cls: 1.0
  lambda_reg: 1.0
  num_epochs: 10