services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutrivision-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/nutrivision.db}
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/data/uploads
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (e.g. openssl rand -hex 32)}
      MODEL_VARIANT: ${MODEL_VARIANT:-fp32}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - nutrivision_data:/app/data
      - nutrivision_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: nutrivision-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nutrivision_data:
    driver: local
  nutrivision_uploads:
    driver: local
